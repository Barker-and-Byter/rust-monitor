[package]
name = "rust-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
docker-wrapper = "0.11.2"
dotenv = "0.15.0"
futures-util = "0.3.33"
http = "1.5.0"
rand = "0.10.2"
reqwest-sse = "0.2.0"
serde = "1.0.229"
sysinfo = "0.39.6"
time = "0.3.55"
tokio = {version = "1.53.1", features = ["full"]}
tokio-stream = "0.1.19"
tower-http = {version = "0.7.0", features = ["cors"]}

[target.'cfg(target_os = "linux")']
runner = "sh -c 'sudo setcap cap_net_bind_service=+ep \"$1\" && \"$1\"' --"
